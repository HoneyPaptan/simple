<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>simple prototype board</title>
<style>
@font-face{font-family:'Geist';src:url('fonts/geist-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'Geist Mono';src:url('fonts/geist-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 900}
:root{
  --bg:#000;--fg:#f8f8f8;--mut:#a1a1a1;--faint:rgba(248,248,248,.48);
  --card:#121212;--raised:#262626;--line:rgba(255,255,255,.1);--hair:rgba(255,255,255,.075);
  --add:#2fc58f;--del:#ff6467;--warn:#e9c055;
  --glass:rgba(255,255,255,.075);--glass-strong:rgba(44,44,46,.66);
  --edge:inset 0 .5px 0 rgba(255,255,255,.22),inset 0 0 0 .5px rgba(255,255,255,.09);
  --blur:blur(28px) saturate(1.7) brightness(1.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0b0b;color:var(--fg);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:56px 56px 80px;width:2720px}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.board-h{margin-bottom:44px}
.board-h h1{font-size:28px;font-weight:600;letter-spacing:-.01em}
.board-h p{color:var(--mut);font-size:15px;margin-top:6px;max-width:900px;line-height:1.5}
section{margin-bottom:64px}
section>h2{font-size:18px;font-weight:600;margin-bottom:6px}
section>p{color:var(--mut);font-size:14px;margin-bottom:22px}
.frames{display:flex;gap:40px;flex-wrap:wrap}
figure{width:390px}
figcaption{margin-top:14px;font-size:14px;color:var(--mut);display:flex;justify-content:space-between}
figcaption b{color:var(--fg);font-weight:500}

.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:52px;overflow:hidden;outline:1px solid rgba(255,255,255,.14);isolation:isolate}
.sb{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;z-index:30;font-size:16px;font-weight:600}
.sb .ic{display:flex;gap:6px;align-items:center}
.topfade{position:absolute;top:0;left:0;right:0;height:118px;background:linear-gradient(#000 62%,rgba(0,0,0,0));z-index:4;pointer-events:none}
.botfade{position:absolute;bottom:0;left:0;right:0;height:150px;background:linear-gradient(rgba(0,0,0,0),#000 55%);z-index:4}
.hdr{position:absolute;top:58px;left:16px;right:16px;height:44px;display:flex;align-items:center;gap:10px;z-index:6}
.hdr .sp{flex:1}
.hdr .t{position:absolute;text-align:center;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:1px}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge),0 6px 20px rgba(0,0,0,.45);flex:none}
.avatar{font-size:14px;color:var(--mut)}
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--edge),0 10px 30px rgba(0,0,0,.5)}

.scroll{position:absolute;inset:0;padding-top:118px;z-index:1}
.lt{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:8px 20px 14px}
.lt span{color:var(--faint)}
.row{display:flex;align-items:center;height:54px;padding:0 20px;position:relative}
.row .ri{width:31px;color:var(--mut);display:flex}
.row .rl{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rl span{color:var(--faint);font-size:15px;margin-left:6px}
.row .rr{color:var(--mut);font-size:16px;display:flex;align-items:center;gap:6px}
.row .rr svg{width:18px;height:18px;color:var(--faint)}
.row::after{content:"";position:absolute;left:51px;right:20px;bottom:0;border-bottom:1px solid var(--hair)}
.row.nl::after{left:20px}
.row.muted .rl{color:var(--mut)}
.sec{font-size:15px;color:var(--faint);margin:22px 20px 6px}
.arow{display:flex;gap:14px;padding:13px 20px 0 30px;position:relative}
.arow .dot{width:8px;height:8px;border-radius:50%;background:#4a4a4a;margin-top:8px;flex:none}
.arow .dot.on{background:var(--warn);box-shadow:0 0 0 4px rgba(233,192,85,.16)}
.arow .dot.run{background:var(--fg)}
.arow .b{flex:1;padding-bottom:13px;border-bottom:1px solid var(--hair);min-width:0}
.arow .t{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .m{font-size:15px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.arow .m svg{width:15px;height:15px}
.add{color:var(--add)}.del{color:var(--del)}.warn{color:var(--warn)}

.cpill{position:absolute;left:12px;right:12px;bottom:30px;height:56px;border-radius:28px;display:flex;align-items:center;gap:10px;padding:0 6px;z-index:8}
.cpill .ph{flex:1;font-size:17px;color:var(--faint)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.09);box-shadow:inset 0 .5px 0 rgba(255,255,255,.16);color:var(--mut);flex:none}
.ib.s{width:34px;height:34px}.ib.s svg{width:19px;height:19px}
.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:#000;flex:none}
.send svg{width:19px;height:19px;stroke-width:2.2}
.ccard{position:absolute;left:12px;right:12px;border-radius:28px;padding:10px 14px 10px;z-index:9}
.handle{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 10px}
.chips{display:flex;gap:12px;font-size:15px;color:var(--mut);align-items:center;flex-wrap:wrap}
.chips span{display:flex;align-items:center;gap:4px}
.chips svg{width:15px;height:15px}
.ctext{font-size:17px;line-height:23px;margin:9px 2px 12px}
.ctext .caret{display:inline-block;width:2px;height:20px;background:var(--fg);vertical-align:-4px;margin-left:1px}
.cbar{display:flex;align-items:center;gap:8px}
.chip{height:30px;border-radius:15px;padding:0 10px;display:flex;align-items:center;gap:5px;font-size:15px;color:var(--fg);background:rgba(255,255,255,.08);box-shadow:inset 0 .5px 0 rgba(255,255,255,.15);white-space:nowrap}
.chip svg{width:14px;height:14px;color:var(--mut)}
.chip.mode{background:rgba(233,192,85,.14);color:var(--warn)}
.chip.mode svg{color:var(--warn)}
.chip.full{background:rgba(255,100,103,.14);color:var(--del)}
.chip.full svg{color:var(--del)}
.chip.plain{background:none;box-shadow:none;padding:0 4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cbar .sp{flex:1}

.kb{position:absolute;left:0;right:0;bottom:0;height:300px;background:rgba(36,36,38,.92);border-radius:28px 28px 0 0;padding:10px 4px 0;z-index:8;box-shadow:inset 0 .5px 0 rgba(255,255,255,.12)}
.kr{display:flex;gap:6px;justify-content:center;margin-bottom:11px}
.k{width:33px;height:44px;border-radius:7px;background:#5a5a5c;display:grid;place-items:center;font-size:22px;color:#fff}
.k.w{width:46px;background:#3e3e40;font-size:15px}
.k.sp{width:186px}
.k.rt{width:88px;background:#3e3e40}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:7}

.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:36px 36px 0 0;z-index:10;background:var(--glass-strong);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:var(--edge),0 -10px 40px rgba(0,0,0,.6);padding-top:8px}
.sheet.stack{left:9px;right:9px;bottom:9px;border-radius:40px;background:rgba(58,58,60,.72)}
.shh{display:flex;align-items:center;padding:8px 16px 12px;position:relative;height:60px}
.shh .t{position:absolute;left:70px;right:70px;text-align:center;font-size:17px;font-weight:600}
.shh .sp{flex:1}
.pillbtn{height:44px;border-radius:22px;padding:0 18px;display:grid;place-items:center;font-size:17px;background:var(--glass);box-shadow:var(--edge)}
.search{margin:0 16px 6px;height:44px;border-radius:22px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--faint);font-size:17px}
.search svg{width:20px;height:20px}
.srow{display:flex;align-items:center;min-height:52px;margin:0 20px;border-bottom:1px solid var(--hair);gap:10px;font-size:17px}
.srow .l{flex:1}
.srow .l small{display:block;color:var(--faint);font-size:14px;margin-top:2px}
.srow .q{color:var(--mut);font-size:15px;margin-left:4px}
.srow .v{color:var(--mut);display:flex;align-items:center;gap:4px}
.srow svg{width:20px;height:20px}
.srow .lead{color:var(--mut)}
.ssec{font-size:15px;color:var(--faint);margin:18px 20px 2px}
.primary{height:50px;border-radius:25px;background:var(--fg);color:#000;display:grid;place-items:center;font-size:17px;font-weight:500}
.secondary{height:50px;border-radius:25px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:17px;box-shadow:var(--edge)}
.toggle{width:52px;height:32px;border-radius:16px;background:rgba(255,255,255,.16);position:relative}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:50%;background:#fff}
.toggle.on{background:var(--add)}
.toggle.on::after{left:22px}

.menu{position:absolute;z-index:12;border-radius:22px;padding:6px;min-width:210px;background:rgba(48,48,50,.7);backdrop-filter:blur(36px) saturate(1.7);-webkit-backdrop-filter:blur(36px) saturate(1.7);box-shadow:var(--edge),0 16px 50px rgba(0,0,0,.7)}
.mi{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;font-size:16px;border-radius:14px}
.mi svg{width:19px;height:19px;color:var(--mut)}
.mi .x{flex:1}
.mi small{color:var(--faint);font-size:13px;display:block}
.mi.sel{background:rgba(255,255,255,.08)}
.mi.danger,.mi.danger svg{color:var(--del)}
.msep{height:1px;background:var(--hair);margin:5px 10px}
.mi.tall{height:auto;padding:9px 12px;align-items:flex-start}

.dialog{position:absolute;left:44px;right:44px;top:50%;transform:translateY(-50%);z-index:12;border-radius:30px;padding:22px 18px 18px;background:rgba(48,48,50,.74);backdrop-filter:blur(40px) saturate(1.6);-webkit-backdrop-filter:blur(40px) saturate(1.6);box-shadow:var(--edge),0 20px 60px rgba(0,0,0,.7);text-align:center}
.dialog h3{font-size:17px;font-weight:600}
.dialog p{font-size:15px;color:var(--mut);margin-top:6px;line-height:1.4}
.dialog .btns{display:flex;gap:10px;margin-top:18px}
.dialog .btns>div{flex:1;height:46px;font-size:16px}
.field{height:46px;border-radius:14px;background:rgba(0,0,0,.35);display:flex;align-items:center;padding:0 12px;margin-top:14px;font-size:16px;text-align:left}
.field .selt{background:rgba(120,160,255,.35);border-radius:3px;padding:1px 0}

.doc{padding:0 20px;font-size:17px;line-height:1.42}
.doc p{margin:0 0 12px}
.doc h3{font-size:22px;font-weight:600;line-height:1.25;margin:16px 0 8px;letter-spacing:-.01em}
.doc h4{font-size:19px;font-weight:600;margin:16px 0 8px;line-height:1.3}
.doc b{font-weight:600}
.doc code{font-family:'Geist Mono',monospace;font-size:14.5px;background:rgba(255,255,255,.09);border-radius:5px;padding:1px 4px}
.doc hr{border:0;border-top:1px solid var(--hair);margin:16px 0}
.bubble{margin:6px 0 16px 54px;background:#1c1c1e;border-radius:24px;padding:13px 16px;font-size:17px;line-height:1.38}
.explored{font-size:16px;color:var(--faint);margin-bottom:6px}
.explored b{color:var(--mut);font-weight:400}
.codecard{border:1px solid var(--line);border-radius:18px;margin:6px 0 14px;overflow:hidden;background:var(--card)}
.codecard .h{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;border-bottom:1px solid var(--hair)}
.codecard .h .lg{color:var(--mut);font-size:14px}
.codecard .h .ln{margin-left:auto;color:var(--mut);font-size:14px}
.codecard pre{font-family:'Geist Mono',monospace;font-size:12.5px;line-height:1.6;padding:10px 14px;white-space:pre;overflow:hidden;position:relative}
.codecard pre .n{color:#5c5c5c;display:inline-block;width:24px}
.cp{width:28px;height:28px;margin:-4px -6px -4px 0;border-radius:50%;display:grid;place-items:center;background:rgba(40,40,40,.8);box-shadow:var(--edge);color:var(--mut)}
.cp svg{width:15px;height:15px}
.kw{color:#c6a6ff}.fn{color:#7fd0ff}.st{color:#a4e08a}.nm{color:#ffcf70}.cm{color:#666}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;margin:6px 0 14px}
.tbl div{display:flex;border-bottom:1px solid var(--hair)}
.tbl div:last-child{border:0}
.tbl span{flex:1;padding:9px 12px}
.tbl span+span{border-left:1px solid var(--hair);font-family:'Geist Mono',monospace;font-size:12.5px;color:var(--mut)}
.tbl .th{background:#111;color:var(--mut)}
.changes{border:1px solid var(--line);border-radius:18px;background:var(--card);margin:4px 0 14px}
.changes .h{padding:12px 14px;font-size:16px;border-bottom:1px solid var(--hair)}
.changes .h span{color:var(--mut)}
.fr{display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;font-size:15px;border-bottom:1px solid var(--hair)}
.fr:last-child{border:0}
.fr .tg{font-family:'Geist Mono',monospace;font-size:11.5px;color:var(--mut);width:22px}
.fr .nm2{flex:1;color:var(--fg)}
.fr .ct{font-family:'Geist Mono',monospace;font-size:13px}
.fr.more{color:var(--mut)}
.acts{position:absolute;left:16px;bottom:100px;display:flex;gap:8px;z-index:8}
.apill{height:38px;border-radius:19px;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:15px}
.apill.w{background:var(--fg);color:#000}
.card{border:1px solid var(--line);border-radius:20px;background:var(--card);padding:14px;margin:4px 0 14px}
.card .ttl{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .sub{font-size:15px;color:var(--mut);margin-top:4px}
.card pre{font-family:'Geist Mono',monospace;font-size:13px;background:#000;border-radius:10px;padding:10px 12px;margin-top:10px;border:1px solid var(--hair);white-space:pre-wrap}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow>div{flex:1;height:42px;border-radius:21px;font-size:16px;display:grid;place-items:center}
.btnrow .w{background:var(--fg);color:#000;font-weight:500}
.btnrow .g{background:rgba(255,255,255,.09);box-shadow:var(--edge)}
.choice{display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;background:rgba(255,255,255,.06);padding:0 12px;margin-top:8px;font-size:15px}
.choice .kn{font-family:'Geist Mono',monospace;color:var(--mut);font-size:13px;width:14px}
.link{color:var(--mut);font-size:15px;margin-top:10px;display:flex;align-items:center;gap:6px}
.link svg{width:16px;height:16px}
.done{color:var(--add);font-size:15px;display:flex;gap:6px;align-items:center;margin:2px 0 12px}
.done svg{width:16px;height:16px}
.peek{border:1px solid var(--line);border-radius:18px;background:#070707;overflow:hidden;margin:4px 0 14px}
.peek .h{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:14px;color:var(--mut);border-bottom:1px solid var(--hair)}
.peek .h .live{width:7px;height:7px;border-radius:50%;background:var(--add)}
.peek pre{font-family:'Geist Mono',monospace;font-size:11.5px;line-height:1.5;padding:9px 12px;color:#cfcfcf;white-space:pre}
.working{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:15px;margin:4px 0 10px}
.orb{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 40deg,var(--fg),rgba(255,255,255,.1) 70%,var(--fg));-webkit-mask:radial-gradient(circle,transparent 4px,#000 5px);mask:radial-gradient(circle,transparent 4px,#000 5px)}
.banner{position:absolute;top:110px;left:50%;transform:translateX(-50%);z-index:7;height:34px;border-radius:17px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.glyph{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#1e1e1e;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12);font-size:11px;font-weight:600;flex:none}
.glyph svg{width:14px;height:14px;stroke-width:2}
</style>
</head>

  <p>Dark, pitch black and white, liquid glass. Frames are 390 by 844 points.</p>
</div>
